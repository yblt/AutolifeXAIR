# 多物品比赛配置文件
# 格式：名称|抓取配置|投放配置|抓取点|投放点|抓取额外参数
#
# 比赛要求：3种饮料 + 3色衣物（红/黄/蓝）
# 使用方法：
#   1. 问工程师确认3种饮料是什么（颜色、名称）
#   2. 修改本文件中bottle_A/B/C的名称和对应的JSON
#   3. 如果投放点不同，修改drop_point
#   4. 运行 ./flow_multi.sh go
#
# 注意：抓取点T2/T4通常是固定的（饮料桌/衣物桌）
#       投放点T3/T5可能因容器位置不同而变化

# === 饮料（3种品类） ===
# 格式：名称|抓取JSON|投放JSON|抓取点|投放点|抓取额外flag
bottle_A|bottle_grasp_red.json|basket_drop.json|T2|T3|--reset-confirmed
bottle_B|bottle_grasp_yellow.json|basket_drop.json|T2|T3|--reset-confirmed
bottle_C|bottle_grasp_blue.json|basket_drop.json|T2|T3|--reset-confirmed

# === 衣物（3色：红/黄/蓝） ===
clothes_red|clothes_grasp_red.json|clothes_drop.json|T4|T5|--reset-confirmed
clothes_yellow|clothes_grasp_yellow.json|clothes_drop.json|T4|T5|--reset-confirmed
clothes_blue|clothes_grasp_blue.json|clothes_drop.json|T4|T5|--reset-confirmed
